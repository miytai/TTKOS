global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: backend
    metrics_path: /api/metrics/
    static_configs:
      - targets: ["backend:8000"]

  - job_name: channels
    static_configs:
      - targets: ["channels:8001"]

  - job_name: nginx
    static_configs:
      - targets: ["nginx:80"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis:9121"]
