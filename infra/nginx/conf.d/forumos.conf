upstream forumos_backend {
    server backend:8000 fail_timeout=10s max_fails=3;
}

upstream forumos_channels {
    server channels:8001 fail_timeout=10s max_fails=3;
}

upstream forumos_frontend {
    server frontend:80 fail_timeout=10s max_fails=3;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Основной сайт (SPA + API + WebSocket) ─────────────────────
server {
    listen 80 default_server;
    server_name _;

    limit_req zone=conns conns=20;

    # ── Security headers (TECHSPEC §15.10) ────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss:; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 12m;

    # ── Статика Django ──────────────────────────────────────────
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
    }

    # ── Аутентификация: жёсткий лимит ────────────────────────────
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://forumos_backend;
        include /etc/nginx/proxy_params_forumos.conf;
    }

    # ── Создание контента: отдельный лимит (TECHSPEC §15.8) ──────
    location ~ ^/api/(threads|posts)/.*$ {
        limit_req zone=content burst=20 nodelay;
        proxy_pass http://forumos_backend;
        include /etc/nginx/proxy_params_forumos.conf;
    }

    # ── WebSocket ────────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://forumos_channels;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── API ──────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://forumos_backend;
        include /etc/nginx/proxy_params_forumos.conf;
    }

    # ── SEO-файлы ────────────────────────────────────────────────
    location = /robots.txt   { proxy_pass http://forumos_backend; include /etc/nginx/proxy_params_forumos.conf; }
    location = /sitemap.xml  { proxy_pass http://forumos_backend; include /etc/nginx/proxy_params_forumos.conf; }
    location ~ ^/sitemap-.*\.xml$ { proxy_pass http://forumos_backend; include /etc/nginx/proxy_params_forumos.conf; }

    # ── SPA ──────────────────────────────────────────────────────
    location / {
        proxy_pass http://forumos_frontend;
        include /etc/nginx/proxy_params_forumos.conf;
    }
}
