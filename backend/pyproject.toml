[project]
name = "forumos-backend"
version = "1.0.0"
description = "ForumOS backend — Django 5 + DRF + Channels + Celery"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["*/migrations/*", ".venv", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "DJ", "RUF"]
ignore = [
    "RUF001",  # неоднозначные юникод-символы в строках — используются осознанно
    "RUF002",
    "RUF003",
    "RUF012",  # DRF/Django-атрибуты классов (permission_classes и т.п.) изменяемы намеренно
    "B008",    # DRF-конфигурация через вызовы в классах (get serializer_class)
    "N806",
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["E501"]
"*/migrations/*" = ["E501", "N806", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "events", "shared", "ws"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py", "*_test.py"]
testpaths = ["tests", "apps", "events", "ws"]
addopts = "-q --strict-markers --disable-warnings"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["apps", "events", "shared", "ws", "config"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "config/wsgi.py",
    "config/asgi.py",
    "config/celery.py",
]

[tool.coverage.report]
fail_under = 80
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
